name: Atualizar cartoes do perfil

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cartoes-do-perfil
  cancel-in-progress: true

jobs:
  cartoes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # O token padrao do Actions nao enxerga repositorios privados nem as contribuicoes privadas.
      - name: Avisar se o token com acesso privado nao esta configurado
        env:
          TEM_TOKEN: ${{ secrets.STATS_TOKEN != '' }}
        run: |
          if [ "$TEM_TOKEN" != "true" ]; then
            echo "::warning::Secret STATS_TOKEN nao configurado: dados privados NAO serao incluidos nos cartoes."
          fi

      # Cada gerador pode falhar sozinho; o SVG anterior continua no repositorio.
      # As acoes de terceiros abaixo estao fixadas por commit (rodam com acesso de escrita).
      - name: Gerar cartao de estatisticas
        id: stats
        uses: stats-organization/github-readme-stats-action@2c498845f71017821efaad14293ebc736156ef21 # v2.1.0
        continue-on-error: true
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&count_private=true&hide_border=true&rank_icon=percentile&locale=pt-br&theme=transparent
          path: profile/stats.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar cartao de sequencia (streak)
        id: streak
        uses: DenverCoder1/github-readme-streak-stats@125aaaf200620410446ebfa51897fca3607e04fd # v1.8.2
        continue-on-error: true
        with:
          options: user=${{ github.repository_owner }}&locale=pt_BR&hide_border=true&theme=transparent
          path: profile/streak.svg
          token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}

      # O gerador de streak pode pular um ano quando a API falha. Contribuicoes quase
      # nunca diminuem, entao uma queda acima de 5% indica dado ruim: mantem o cartao anterior.
      - name: Manter o streak anterior se o total cair
        run: |
          total() { sed 's/<[^>]*>/ /g' "$1" | tr -s ' \n' ' ' | grep -oE '[0-9.,]+ (Total Contributions|Total de contribui[^ ]*)' | tr -dc '0-9'; }
          git show HEAD:profile/streak.svg > "$RUNNER_TEMP/streak-antigo.svg" 2>/dev/null || exit 0
          antigo=$(total "$RUNNER_TEMP/streak-antigo.svg")
          novo=$(total profile/streak.svg)
          echo "Total anterior: ${antigo:-?} | Total novo: ${novo:-?}"
          if [ -n "$antigo" ] && [ -n "$novo" ] && [ $((novo * 100)) -lt $((antigo * 95)) ]; then
            echo "::warning::Total do streak caiu de $antigo para $novo; mantendo o cartao anterior."
            git checkout -- profile/streak.svg
          fi

      - name: Gerar animacao da cobrinha
        id: snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        continue-on-error: true
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark

      - name: Gerar campo minado do dia
        id: campo
        continue-on-error: true
        run: node .github/scripts/campo-minado.mjs

      # continue-on-error faz a etapa falha parecer sucesso; aqui a falha vira aviso visivel.
      - name: Avisar geradores que falharam
        if: always()
        env:
          STATS: ${{ steps.stats.outcome }}
          STREAK: ${{ steps.streak.outcome }}
          SNAKE: ${{ steps.snake.outcome }}
          CAMPO: ${{ steps.campo.outcome }}
        run: |
          for item in "estatisticas:$STATS" "streak:$STREAK" "cobrinha:$SNAKE" "campo minado:$CAMPO"; do
            if [ "${item#*:}" = "failure" ]; then
              echo "::warning::Gerador de ${item%%:*} falhou; o cartao anterior foi mantido. Veja o log da etapa (token invalido ou limite da API)."
            fi
          done

      - name: Salvar cartoes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg README.md
          if git diff --cached --quiet; then
            echo "Nada a commitar."
            exit 0
          fi
          git commit -m "chore: atualiza cartoes e campo minado"
          # Integra commits que tenham chegado ao main durante a execucao.
          git pull --rebase --quiet
          git push
