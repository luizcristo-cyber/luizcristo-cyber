name: Cobrinha das contribuicoes

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cobrinha
  cancel-in-progress: true

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Fixada no commit da v3.5.0: esta acao de terceiros roda com acesso ao repositorio.
      - name: Gerar animacao da cobrinha
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # As imagens ficam numa branch separada (sem historico), para nao poluir o main.
      - name: Publicar na branch output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan output
          git rm -rf --quiet .
          mv dist/*.svg .
          rmdir dist
          git add github-snake.svg github-snake-dark.svg
          git commit -q -m "cobrinha: atualiza animacao"
          git push --force origin output
